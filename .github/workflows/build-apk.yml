name: Build Android APK (توليد تطبيق APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        run: |
          echo "Setting up Android SDK..."
          mkdir -p $HOME/android-sdk/cmdline-tools
          export ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_ENV
          
          # Download command-line tools
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
          mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
          
          # Accept licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK via Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate & Package APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" build-output/BMTahabort-FloodStudy-App.apk
          else
            echo "Error: No APK found after build"
            exit 1
          fi

      - name: Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMTahabort-FloodStudy-APK
          path: build-output/BMTahabort-FloodStudy-App.apk
          retention-days: 60

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "BMTahabort Flood Study Android App v1.0.0 (تطبيق الهاتف)"
          body: |
            ### 📱 تطبيق دراسات الهيدرولوجيا ومكافحة الفيضانات (Android APK)
            
            يمكنك تنزيل ملف التطبيق **BMTahabort-FloodStudy-App.apk** وتثبيته مباشرة على هاتفك بنقرة واحدة دون الحاجة لفك الضغط.
            
            - **الإصدار**: 1.0.0
            - **النظام المدعوم**: Android 7.0+ (API 24+)
          files: build-output/BMTahabort-FloodStudy-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
