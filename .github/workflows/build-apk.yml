name: Build Android APK (توليد تطبيق APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK via Gradle
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Locate & Package APK
        run: |
          mkdir -p build-output
          APK_PATH=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK at: $APK_PATH"
            cp "$APK_PATH" build-output/BMTahabort-FloodStudy-App.apk
          else
            echo "Error: No APK found after build"
            exit 1
          fi

      - name: Upload APK as GitHub Action Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMTahabort-FloodStudy-APK
          path: build-output/BMTahabort-FloodStudy-App.apk
          retention-days: 60

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        continue-on-error: true
        with:
          tag_name: v1.0.0
          name: "BMTahabort Flood Study Android App v1.0.0 (تطبيق الهاتف)"
          body: |
            ### 📱 تطبيق دراسات الهيدرولوجيا ومكافحة الفيضانات (Android APK)
            
            يمكنك تنزيل ملف التطبيق **BMTahabort-FloodStudy-App.apk** وتثبيته مباشرة على هاتفك بنقرة واحدة دون الحاجة لفك الضغط.
            
            - **الإصدار**: 1.0.0
            - **النظام المدعوم**: Android 7.0+ (API 24+)
          files: build-output/BMTahabort-FloodStudy-App.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
